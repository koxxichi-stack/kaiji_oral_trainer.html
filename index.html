<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海事代理士 口述試験トレーナー</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#f4f6f8;color:#17202a;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
main{max-width:720px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:22px;box-shadow:0 3px 16px #0001}
h1{font-size:24px;margin:0 0 5px}.sub{color:#657786;margin-bottom:18px}select,button{width:100%;font-size:17px;border-radius:13px;padding:14px;margin:6px 0;border:1px solid #ccd3da;background:#fff}
button{cursor:pointer;font-weight:650;min-height:52px}.primary{background:#1267d6;color:white;border:0}.mic{background:#147a3d;color:white;border:0}
.q{font-size:22px;line-height:1.55;min-height:115px;margin:18px 0}.stats{color:#59636e;margin:12px 0}.answer{display:none;background:#eef4ff;padding:16px;border-radius:12px;line-height:1.65;margin:10px 0}
.heard{display:none;background:#f6f7f8;padding:12px;border-radius:10px;margin:8px 0;color:#45515d}
.row{display:flex;gap:7px}.row button{flex:1}.note{font-size:13px;color:#68737d;margin-top:12px;line-height:1.5}
</style>
</head>
<body><main><div class="card">
<h1>⚓ 海事代理士 口述試験</h1><div class="sub">船舶法・スマホ練習版</div>
<select id="mode"><option value="random">ランダム出題</option><option value="order">順番に出題</option></select>
<div class="stats" id="stats"></div><div class="q" id="q"></div>
<button class="primary" id="speak">🔊 問題を読み上げる</button>
<button class="mic" id="listen">🎙️ 口頭で回答する</button>
<div class="heard" id="heard"></div>
<button id="show">模範解答を見る</button><div class="answer" id="ans"></div>
<div class="row"><button id="bad">× 不正解</button><button id="close">△ 惜しい</button><button id="good">○ 正解</button></div>
<button id="next">次の問題 →</button>
<div class="note" id="note">※ 音声回答は対応ブラウザのみ。使えない場合でも「問題読み上げ」「模範解答」「採点」は使えます。</div>
</div></main>
<script>
(function(){
"use strict";
const qs=[
["船籍港の定め方について、原則をすべて答えてください。","日本国内であること。市町村の名称によること。船舶の航行できる水面に接した場所であること。"],
["船舶国籍証書の交付を受けている船舶が譲渡された場合の手続きを、順に述べてください。","新所有者は船籍港を管轄する登記所に所有権移転登記を申請し、その後、管海官庁に変更登録を申請し、船舶国籍証書の書換えを申請します。"],
["船舶の総トン数の測度の申請があった場合、管海官庁が提出を求めることができる書面を4つ述べてください。","船体中心線縦断面図、各甲板平面図、船体横断面図、鋼材配置図等の総トン数測度に必要な図面・書面。"],
["日本国内で総トン数の改測を受けた場合の、管海官庁の窓口における手数料納付方法を述べてください。","手数料納付書に、手数料額に相当する収入印紙を貼付して納付します。"],
["信号符字を点附する船舶について述べてください。","総トン数100トン以上の船舶など、法令で定める船舶に信号符字が点附されます。"],
["船舶国籍証書の交付を受けている船舶の所有者の氏名又は名称に変更があった場合の手続きを順に述べてください。","船籍港を管轄する登記所に変更登記を申請し、その後、管海官庁に変更登録を申請し、同時に船舶国籍証書の書換えを申請します。"],
["船舶に標示する船名に使用できる文字の種類について、漢字・平仮名以外をすべて述べてください。","片仮名、アラビア数字、ローマ字、国土交通大臣が指定する記号。"],
["仮船舶国籍証書の交付を受けられる主な場合を述べてください。","船舶国籍証書が滅失・毀損した場合、記載事項に変更が生じた場合、外国航行中にこれらの事由が生じた場合、国内で船籍港を定めない場合、外国で船舶を取得した場合などです。"],
["外国で交付を受ける仮船舶国籍証書の最長の有効期間を述べてください。","1年です。"],
["船舶国籍証書の書換えが必要となる場合を述べてください。","船舶国籍証書の記載事項に変更を生じた場合、または船舶国籍証書が毀損した場合です。"],
["船舶国籍証書の再交付が必要となる場合を述べてください。","船舶国籍証書が滅失した場合です。"],
["船舶国籍証書を検認する時期について述べてください。","交付または前回検認の日から、総トン数100トン以上の鋼製船舶は4年、100トン未満の鋼製船舶は2年、木製船舶は1年を経過した後、定められた期日までに受けます。"],
["総トン数計算書の謄本の交付を申請する場合の手数料納付方法を述べてください。","申請書に手数料額に相当する収入印紙を貼付して納付します。"],
["船舶法上の汽船と帆船を述べてください。","汽船は機械力をもって運航する船舶です。帆船は帆を主な推進力として運航する船舶です。"],
["船舶に標示する事項を述べてください。","船名、船籍港、船舶番号、総トン数、喫水の尺度など、法令で定める事項です。"],
["船舶国籍証書が失効する主な場合を述べてください。","日本の国籍を喪失したとき、解撤されたとき、船舶の存否が3か月間不明となったときなどです。"],
["仮船舶国籍証書が失効する主な場合を述べてください。","船舶国籍証書の交付を受けた場合、書換えにより新証書の交付を受けた場合、仮船舶国籍証書の目的となった事由が解消した場合などです。"],
["船舶所有者が船舶の存否を知ることができない場合の抹消登録について述べてください。","法定の要件を満たす場合、管海官庁は所有者に抹消登録を催告し、正当な理由なく手続きをしないときは職権で抹消登録をすることができます。"],
["船舶が外国にある場合など、やむを得ない事由があるときの手続きについて述べてください。","法令に定める場合には、期間の延長や仮船舶国籍証書の交付などの特例手続きが認められます。"],
["日本船舶の基本的な権利・義務を述べてください。","日本の国旗を掲げ、法令に従って日本船舶として航行します。"]
];
let idx=0, correct=0, review=0, order=0;
const $=id=>document.getElementById(id);
function choose(){ if($("mode").value==="random") idx=Math.floor(Math.random()*qs.length); else {idx=order%qs.length;order++;} render();}
function render(){ $("q").textContent="第"+(idx+1)+"問　"+qs[idx][0]; $("ans").textContent=qs[idx][1]; $("ans").style.display="none"; $("heard").style.display="none"; $("stats").textContent="全"+qs.length+"問　正解 "+correct+" / 要復習 "+review;}
$("next").addEventListener("click",choose);
$("mode").addEventListener("change",()=>{order=0;choose();});
$("show").addEventListener("click",()=>{$("ans").style.display="block";});
$("good").addEventListener("click",()=>{correct++;choose();});
$("close").addEventListener("click",()=>{review++;choose();});
$("bad").addEventListener("click",()=>{review++;choose();});
$("speak").addEventListener("click",()=>{
 if(!("speechSynthesis" in window)){alert("このブラウザは読み上げに対応していません。");return;}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(qs[idx][0]);u.lang="ja-JP";u.rate=.92;
 speechSynthesis.speak(u);
});
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
 $("listen").addEventListener("click",()=>{
  const r=new SR();r.lang="ja-JP";r.interimResults=false;r.maxAlternatives=1;
  $("heard").style.display="block";$("heard").textContent="聞き取り中…";
  r.onresult=e=>{$("heard").textContent="あなたの回答： "+e.results[0][0].transcript;};
  r.onerror=e=>{$("heard").textContent="音声認識できませんでした。模範解答で確認してください。";};
  try{r.start();}catch(e){}
 });
}else{
 $("listen").disabled=true;$("listen").textContent="🎙️ 音声回答（このブラウザでは非対応）";
}
choose();
})();
</script></body></html>
