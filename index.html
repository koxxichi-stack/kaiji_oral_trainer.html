<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>海事代理士 口述試験トレーナー</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;margin:0;background:#f5f7fb;color:#172033}
main{max-width:760px;margin:auto;padding:22px}
.card{background:white;border-radius:16px;padding:22px;box-shadow:0 4px 18px #00000012}
h1{font-size:24px;margin:0 0 8px}.sub{color:#667085;margin-bottom:20px}
.q{font-size:22px;line-height:1.6;font-weight:700;margin:18px 0}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:14px 16px;margin:5px 4px;cursor:pointer;background:#e8edf7;color:#172033}
.primary{background:#1769e0;color:white}.good{background:#16803c;color:white}.bad{background:#c73535;color:white}
#answer{display:none;background:#f1f5f9;padding:15px;border-radius:12px;margin-top:14px;line-height:1.6}
#status{min-height:24px;color:#475467;margin-top:12px}
.score{margin-top:18px;font-size:14px;color:#667085}
</style>
</head>
<body>
<main>
<div class="card">
<h1>海事代理士 口述試験トレーナー</h1>
<div class="sub">Safari / Chrome対応・音声読み上げ</div>
<div id="counter"></div>
<div class="q" id="question"></div>
<div>
<button class="primary" id="speak">🔊 問題を読み上げる</button>
<button id="stop">⏹ 読み上げ停止</button>
</div>
<div>
<button id="show">模範解答を見る</button>
<button id="next">次の問題 ▶</button>
</div>
<div id="answer"></div>
<div>
<button class="bad rate" data-v="bad">不正解</button>
<button class="rate" data-v="close">惜しい</button>
<button class="good rate" data-v="good">正解</button>
</div>
<div id="status"></div>
<div class="score" id="score"></div>
</div>
</main>
<script>
const questions=[
 {q:"海事代理士法の目的を答えてください。",a:"海事代理士の制度を定め、その業務の適正を図り、海事に関する行政手続の円滑化に資することです。"},
 {q:"海事代理士が業務を行うために必要な登録について答えてください。",a:"海事代理士試験に合格するなど所定の資格を有し、海事代理士名簿への登録を受ける必要があります。"},
 {q:"船舶の総トン数とは何を表すものですか。",a:"船舶の大きさを、その閉囲場所の容積を基礎として表す指標です。"},
 {q:"船舶国籍証書はどのような船舶に関係する証書ですか。",a:"日本船舶の国籍を公証するための証書です。"},
 {q:"船員法上、船長の重要な職務を一つ答えてください。",a:"船舶の安全な運航、船内秩序の維持、乗組員の監督などを行います。"}
];
let i=0, score={good:0,close:0,bad:0};
const $=id=>document.getElementById(id);
function render(){
 $('counter').textContent=`問題 ${i+1} / ${questions.length}`;
 $('question').textContent=questions[i].q;
 $('answer').textContent=questions[i].a;
 $('answer').style.display='none';
 $('status').textContent='';
 $('score').textContent=`正解 ${score.good}　惜しい ${score.close}　不正解 ${score.bad}`;
}
function speak(){
 const text=questions[i].q;
 if(!('speechSynthesis' in window)){ $('status').textContent='このブラウザは音声読み上げに対応していません。'; return; }
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 u.lang='ja-JP'; u.rate=0.9; u.pitch=1; u.volume=1;
 const voices=window.speechSynthesis.getVoices();
 const ja=voices.find(v=>/^ja/i.test(v.lang));
 if(ja) u.voice=ja;
 u.onstart=()=>{$('status').textContent='問題を読み上げています…';};
 u.onend=()=>{$('status').textContent='読み上げ完了';};
 u.onerror=e=>{$('status').textContent='読み上げエラー：'+(e.error||'不明');};
 window.speechSynthesis.speak(u);
 // Safari対策: 一時停止状態を解除
 setTimeout(()=>{ if(window.speechSynthesis.paused) window.speechSynthesis.resume(); },100);
}
$('speak').addEventListener('click',speak);
$('stop').addEventListener('click',()=>{window.speechSynthesis.cancel();$('status').textContent='読み上げを停止しました';});
$('show').addEventListener('click',()=>{$('answer').style.display='block';});
$('next').addEventListener('click',()=>{window.speechSynthesis.cancel();i=(i+1)%questions.length;render();});
document.querySelectorAll('.rate').forEach(b=>b.addEventListener('click',()=>{score[b.dataset.v]++;render();}));
window.addEventListener('pagehide',()=>{if('speechSynthesis'in window)window.speechSynthesis.cancel();});
if('speechSynthesis' in window){window.speechSynthesis.getVoices(); setTimeout(()=>window.speechSynthesis.getVoices(),300);}
render();
</script>
</body>
</html>
